[package]
name = "iceman"
description = "Iceman is a tool for working with Apache Iceberg."
repository = "https://github.com/rchowell/iceman"
authors = ["R. Conner Howell"]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "iceman"
path = "src/bin/iceman.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
glob = "0.3"
sigpipe = "0.1"
tempfile = "3"
iceberg = { git = "https://github.com/rchowell/iceberg-rust", rev  = "dacf380" }
iceberg-catalog-glue = { git = "https://github.com/rchowell/iceberg-rust", rev  = "dacf380" }
iceberg-catalog-hms = { git = "https://github.com/rchowell/iceberg-rust", rev  = "dacf380" }
iceberg-catalog-rest = { git = "https://github.com/rchowell/iceberg-rust", rev  = "dacf380" }
iceberg-catalog-s3tables = { git = "https://github.com/rchowell/iceberg-rust", rev  = "dacf380" }
iceberg-catalog-sql = { git = "https://github.com/rchowell/iceberg-rust", rev  = "dacf380" }
iceberg-storage-opendal = { git = "https://github.com/rchowell/iceberg-rust", rev  = "dacf380" }
futures = "0.3"
reqsign = "0.16"
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["any", "sqlite", "runtime-tokio", "tls-rustls"], default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"

[dev-dependencies]
iceberg-catalog-sql = { git = "https://github.com/rchowell/iceberg-rust", rev  = "dacf380" }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["any", "sqlite", "runtime-tokio", "tls-rustls", "migrate"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
