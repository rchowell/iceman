table: sf_1.value_file_stats
scale: 1
compression_ratio: 3.0

schema:
  id:
    type: long
    nullable: false
    distribution: sequence
  ts:
    type: timestamp
    nullable: false
    distribution: uniform
    range: ["2023-01-01T00:00:00", "2024-12-31T23:59:59"]
  region:
    type: string
    nullable: false
    distribution: uniform
    values: [region-0, region-1, region-2, region-3, region-4,
             region-5, region-6, region-7, region-8, region-9]
  value:
    type: double
    nullable: false
    distribution: uniform
    range: [0, 10000]
  payload:
    type: string
    nullable: false
    distribution: uniform
    length: [256, 256]

file_buckets:
  column: value
  num_buckets: 1000
  bucket_width: 10
  rows_per_file: 3300
